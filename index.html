<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f2937" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <title>PakSlim</title>
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="hero-top">
        <div>
          <p class="eyebrow">Mobiele paklijst</p>
          <h1>PakSlim</h1>
          <p class="subtitle">Maak snel een slimme paklijst voor kamp, weekend weg, vakantie of een dagje weg.</p>
        </div>

        <label class="theme-switcher" for="theme-select">
          <span>Thema</span>
          <select id="theme-select" aria-label="Kies een kleurenthema">
            <option value="light">Licht</option>
            <option value="dark">Donker</option>
            <option value="sunset">Accent</option>
          </select>
        </label>
      </div>
    </header>

    <main>
      <section class="card">
        <h2>Nieuwe trip</h2>
        <form id="trip-form" class="trip-form">
          <label>
            Trip naam
            <input type="text" id="trip-name" placeholder="Bijv. Kamp Open Hof" maxlength="50" />
          </label>

          <div class="grid two">
            <label>
              Soort trip
              <select id="trip-type">
                <option value="kamp">Kamp</option>
                <option value="weekend">Weekend weg</option>
                <option value="vakantie">Vakantie</option>
                <option value="dagje">Dagje weg</option>
              </select>
            </label>

            <label>
              Aantal dagen
              <input type="number" id="trip-days" min="1" max="30" value="3" />
            </label>
          </div>

          <div class="grid two">
            <label>
              Weer
              <div id="trip-weather" class="weather-options" role="group" aria-label="Selecteer een of meer weertypes">
                <label class="weather-option">
                  <input type="checkbox" name="trip-weather" value="normaal" checked />
                  <span>Normaal</span>
                </label>
                <label class="weather-option">
                  <input type="checkbox" name="trip-weather" value="warm" />
                  <span>Warm</span>
                </label>
                <label class="weather-option">
                  <input type="checkbox" name="trip-weather" value="koud" />
                  <span>Koud</span>
                </label>
                <label class="weather-option">
                  <input type="checkbox" name="trip-weather" value="regen" />
                  <span>Regen</span>
                </label>
              </div>
            </label>

            <label>
              Overnachting
              <select id="trip-overnight">
                <option value="ja">Ja</option>
                <option value="nee">Nee</option>
              </select>
            </label>
          </div>

          <div class="button-row">
            <button type="submit" class="primary-btn">Genereer paklijst</button>
            <button type="button" id="reset-btn" class="secondary-btn">Reset</button>
          </div>
        </form>

        <details class="compact-section">
          <summary>Persoonlijke standaarditems</summary>
          <div class="compact-content">
            <div class="grid defaults-grid">
              <input type="text" id="personal-item-name" placeholder="Bijv. Lenzenvloeistof" maxlength="50" />
              <select id="personal-item-category">
                <option value="Essentieel">Essentieel</option>
                <option value="Kleding">Kleding</option>
                <option value="Toiletspullen">Toiletspullen</option>
                <option value="Slapen">Slapen</option>
                <option value="Elektronica">Elektronica</option>
                <option value="Extra">Extra</option>
              </select>
              <select id="personal-item-scope">
                <option value="always">Altijd toevoegen</option>
                <option value="kamp">Alleen bij kamp</option>
                <option value="weekend">Alleen bij weekend weg</option>
                <option value="vakantie">Alleen bij vakantie</option>
                <option value="dagje">Alleen bij dagje weg</option>
              </select>
              <select id="personal-item-weather">
                <option value="any">Bij elk weer</option>
                <option value="normaal">Alleen normaal</option>
                <option value="warm">Alleen warm</option>
                <option value="koud">Alleen koud</option>
                <option value="regen">Alleen regen</option>
              </select>
              <button id="add-personal-item-btn" class="secondary-btn" type="button">Toevoegen</button>
            </div>
            <div id="personal-defaults-list" class="personal-defaults-list"></div>
          </div>
        </details>

        <details class="compact-section">
          <summary>Opgeslagen trips</summary>
          <div class="compact-content">
            <div class="saved-trips-toolbar">
              <div class="search-group">
                <input type="search" id="saved-trips-search" placeholder="Zoek op naam of type" maxlength="50" />
                <button id="saved-trips-clear" class="mini-btn ghost-btn hidden" type="button">Wis</button>
              </div>
              <select id="saved-trips-sort" aria-label="Sorteer opgeslagen trips">
                <option value="recent">Nieuwste eerst</option>
                <option value="oldest">Oudste eerst</option>
                <option value="name">Naam</option>
              </select>
            </div>
            <div id="saved-trips-list" class="saved-trips-list"></div>
          </div>
        </details>
      </section>

      <section id="packing-section" class="card hidden">
        <div class="section-top">
          <div>
            <p class="eyebrow">Huidige lijst</p>
            <h2 id="trip-title">Jouw paklijst</h2>
          </div>
          <div class="progress-box">
            <span id="progress-text">0 van 0 ingepakt</span>
            <div class="progress-track"><div id="progress-bar"></div></div>
          </div>
        </div>

        <div class="packing-toolbar">
          <label class="toggle-chip" for="filter-unpacked">
            <input type="checkbox" id="filter-unpacked" />
            <span>Nog pakken</span>
          </label>
          <div class="save-trip-group">
            <button id="save-trip-btn" class="secondary-btn toolbar-btn" type="button">Trip opslaan</button>
            <span id="save-trip-feedback" class="save-trip-feedback hidden" aria-live="polite"></span>
          </div>
        </div>

        <div class="add-item-panel">
          <h3>Extra item toevoegen</h3>
          <div class="grid add-grid">
            <input type="text" id="custom-item-name" placeholder="Bijv. Powerbank" maxlength="50" />
            <select id="custom-item-category">
              <option value="Essentieel">Essentieel</option>
              <option value="Kleding">Kleding</option>
              <option value="Toiletspullen">Toiletspullen</option>
              <option value="Slapen">Slapen</option>
              <option value="Elektronica">Elektronica</option>
              <option value="Extra">Extra</option>
            </select>
            <button id="add-item-btn" class="secondary-btn" type="button">Toevoegen</button>
          </div>
        </div>

        <div class="notes-panel">
          <label for="trip-notes">
            Notities
            <textarea id="trip-notes" rows="3" placeholder="Bijv. Vergeet kampboekje of medicatieschema niet."></textarea>
          </label>
        </div>

        <section id="suggestions-panel" class="suggestions-panel hidden" aria-live="polite">
          <div class="suggestions-top">
            <div>
              <p class="eyebrow">Slimme suggesties</p>
              <h3>Eerder gebruikt bij dit tripprofiel</h3>
            </div>
            <p id="suggestions-meta" class="suggestions-meta"></p>
          </div>
          <div id="suggested-items" class="suggested-items"></div>
          <p id="removed-items-note" class="removed-items-note hidden"></p>
        </section>

        <div id="packing-list" class="packing-list"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
